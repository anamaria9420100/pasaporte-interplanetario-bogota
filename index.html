<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pasaporte Interplanetario · EDX + EXO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B1A;
  --ink:#EAF2FF; --ink2:#9FB3D9; --ink3:#5E749E;
  --accent:#0BBBEF; --accent2:#0BBBEF88;
  --panel:rgba(255,255,255,.05); --panel-b:rgba(255,255,255,.12);
  --r:20px;
  --font-d:'Orbitron',sans-serif; --font-b:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-b);background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;position:relative}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 80% 10%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 45% 60%, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 65% 80%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,.3) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 92% 45%, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 30%, rgba(255,255,255,.3) 50%, transparent 51%);
}
body::after{
  content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 50% 0%, var(--accent2), transparent 55%);opacity:.35;transition:background .4s;
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.eyebrow{font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:10px;justify-content:center}
.eyebrow::before,.eyebrow::after{content:'';width:22px;height:1px;background:var(--accent);opacity:.5}

/* LANDING */
.landing{max-width:640px;width:100%;text-align:center}
.landing h1{font-family:var(--font-d);font-weight:900;font-size:clamp(26px,5vw,40px);margin-bottom:8px;
  background:linear-gradient(135deg,var(--ink),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.landing p.sub{color:var(--ink2);font-size:14px;margin-bottom:30px}
.planet-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.planet-card{position:relative;border-radius:18px;cursor:pointer;transition:all .2s;text-align:left;overflow:hidden;
  border:1px solid var(--panel-b);background:rgba(255,255,255,.03);display:flex;flex-direction:column}
.planet-card:hover{transform:translateY(-4px);border-color:var(--pc-accent)}
.planet-card .pc-img{width:100%;height:150px;background-color:#0d1428;background-repeat:no-repeat;background-size:contain;background-position:center bottom}
.planet-card .pc-body{padding:12px 14px 16px}
.planet-card .pc-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--pc-accent);color:var(--pc-accent);
  font-family:var(--font-d);font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;margin-bottom:6px}
.planet-card .pc-name{font-family:var(--font-d);font-weight:800;font-size:15px;color:var(--ink)}
.planet-card .pc-tag{font-size:10.5px;color:var(--ink2);margin-top:3px;line-height:1.35}
.gear-link{margin-top:28px;display:inline-block;color:var(--ink3);font-size:12px;text-decoration:none;border-bottom:1px dotted var(--ink3)}

/* CARD (form) */
.card{max-width:460px;width:100%;background:var(--panel);border:1px solid var(--panel-b);border-radius:var(--r);padding:30px 26px;backdrop-filter:blur(8px);box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.card-banner{width:calc(100% + 52px);margin:-30px -26px 14px;height:180px;background-color:#0d1428;background-size:contain;background-repeat:no-repeat;background-position:center bottom;position:relative;border-radius:20px 20px 0 0;overflow:hidden}
.card-banner .cb-badge{position:absolute;top:10px;left:16px;z-index:1;background:rgba(0,0,0,.5);border:1px solid var(--accent);color:var(--accent);
  font-family:var(--font-d);font-size:10px;font-weight:700;padding:4px 10px;border-radius:100px}
.card-head{text-align:center;margin-bottom:22px}
.card-head .p-icon{font-size:40px;margin-bottom:8px}
.card-head h2{font-family:var(--font-d);font-weight:800;font-size:20px;color:var(--ink)}
.card-head p{color:var(--ink2);font-size:12.5px;margin-top:4px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px;letter-spacing:.4px;text-transform:uppercase}
.field input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--panel-b);border-radius:12px;padding:13px 14px;color:var(--ink);font-family:var(--font-b);font-size:15px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--ink3)}
.grp-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grp-btn{padding:12px 0;border-radius:12px;border:1px solid var(--panel-b);background:rgba(255,255,255,.05);color:var(--ink2);font-family:var(--font-d);font-weight:700;font-size:14px;cursor:pointer;transition:all .18s}
.grp-btn.sel,.grp-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,.1)}
.btn-main{width:100%;margin-top:8px;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#031018;font-family:var(--font-d);font-weight:800;font-size:14px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px var(--accent2)}
.btn-main:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{width:100%;margin-top:10px;padding:13px;border:1px solid var(--panel-b);border-radius:14px;background:transparent;color:var(--ink2);font-family:var(--font-b);font-weight:600;font-size:13px;cursor:pointer}

.q-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.ring-wrap{position:relative;width:56px;height:56px;flex-shrink:0}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;font-size:16px;color:var(--ink)}
.q-progress{font-size:11px;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.q-text{font-family:var(--font-b);font-weight:700;font-size:16px;color:var(--ink);line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt-btn{text-align:left;padding:14px 16px;border-radius:13px;border:1px solid var(--panel-b);background:rgba(255,255,255,.05);color:var(--ink);font-family:var(--font-b);font-size:14.5px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px}
.opt-btn .opt-letter{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:12px;font-weight:700;flex-shrink:0}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(255,255,255,.1)}
.opt-btn:disabled{cursor:not-allowed}
.opt-btn.correct{border-color:#43C97B;background:rgba(67,201,123,.14)}
.opt-btn.wrong{border-color:#FF5C5C;background:rgba(255,92,92,.14)}
.result-wrap{text-align:center}
.result-score{font-family:var(--font-d);font-weight:900;font-size:56px;background:linear-gradient(135deg,var(--ink),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:12px 0 4px}
.result-label{font-size:12px;color:var(--ink3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:22px}
.result-msg{font-size:14px;color:var(--ink2);line-height:1.6;margin-bottom:6px}

/* HOST */
.host-wrap{max-width:680px;width:100%}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.tab{padding:9px 16px;border-radius:100px;border:1px solid var(--panel-b);background:rgba(255,255,255,.04);color:var(--ink2);font-family:var(--font-d);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s}
.tab.active{background:var(--tab-accent,var(--accent));color:#031018;border-color:transparent}
.pin-wrap{max-width:320px;width:100%;text-align:center}
.host-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.host-title{font-family:var(--font-d);font-weight:800;font-size:16px}
.status-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid var(--panel-b);font-size:12.5px;color:var(--ink2)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#43C97B;box-shadow:0 0 8px #43C97B}
.status-pill.closed .status-dot{background:#FF5C5C;box-shadow:0 0 8px #FF5C5C}
.host-stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-chip{background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;padding:10px 16px;text-align:center;flex:1;min-width:110px}
.stat-chip b{display:block;font-family:var(--font-b);font-weight:700;font-size:22px;color:var(--accent)}
.stat-chip span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
.actions-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.actions-row button{flex:1;min-width:130px;padding:13px;border:none;border-radius:14px;font-family:var(--font-d);font-weight:700;font-size:13px;cursor:pointer}
.btn-danger{background:linear-gradient(135deg,#FF5C5C,#C0392B);color:white}
.btn-open{background:linear-gradient(135deg,#43C97B,#2FAE64);color:#04140b}
.actions-row .btn-ghost2{background:transparent;border:1px solid var(--panel-b);color:var(--ink2)}
table.lb{width:100%;border-collapse:collapse;background:rgba(255,255,255,.03);border:1px solid var(--panel-b);border-radius:14px;overflow:hidden}
table.lb th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--panel-b)}
table.lb td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.05)}
table.lb tr:last-child td{border-bottom:none}
table.lb tr:nth-child(1) td{color:#FFD54A;font-weight:700}
table.lb tr:nth-child(2) td{color:#C9D6E8;font-weight:700}
table.lb tr:nth-child(3) td{color:#D8A76A;font-weight:700}
.podium{display:flex;gap:10px;margin-bottom:18px;align-items:flex-end}
.podium-slot{flex:1;text-align:center;background:var(--panel);border:1px solid var(--panel-b);border-radius:14px;padding:14px 8px}
.podium-slot .medal{font-size:26px}
.podium-slot .pname{font-family:var(--font-d);font-weight:700;font-size:12px;margin-top:6px}
.podium-slot .pscore{font-size:11px;color:var(--ink3);margin-top:2px}
.empty-lb{text-align:center;padding:30px;color:var(--ink3);font-size:13px}
.back-link{display:block;text-align:center;margin-top:16px;color:var(--ink3);font-size:12px;text-decoration:none}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:999;
  background:#101a33;border:1px solid var(--panel-b);color:var(--ink);padding:12px 20px;border-radius:100px;
  font-size:13px;font-weight:600;box-shadow:0 14px 34px -10px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:all .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:#FF5C5C;color:#FF9B9B}
#toast.ok{border-color:#43C97B;color:#8CF0B4}

@media(max-width:480px){
  .card{padding:24px 18px}
  .planet-grid{grid-template-columns:1fr}
}
</style>
</head>

<div id="app"></div>
<div id="toast"></div>

<script>
const app = document.getElementById('app');
let currentPlanet = null;
let session = { nombre:'', grupo:'', qIndex:0, puntaje:0, detalle:[] };
let timerHandle = null;

function setAccent(hex){
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent2', hex + '88');
}

/* ─────────── AVISOS VISIBLES ─────────── */
let toastTimer = null;
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = ''; }, 2800);
}

/* ─────────── BACKEND: Google Apps Script (lee, escribe y controla estado real) ─────────── */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxiEGv6zImX-Fwu9DoJLb6d1AFpNYwZYsC0Z25HYb4CX7V2A5zuz_Bi3_Z9zdm4kXwU/exec';

async function apiGet(params){
  try{
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(SCRIPT_URL + '?' + qs);
    return await res.json();
  }catch(e){ console.error(e); return null; }
}
async function apiPost(body){
  try{
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS con Apps Script
      body: JSON.stringify(body)
    });
    return await res.json();
  }catch(e){ console.error(e); return null; }
}

async function getEstado(pid){
  const r = await apiGet({ action:'getEstado', planeta: pid });
  return (r && r.estado) ? r.estado : 'abierto';
}
async function setEstado(pid, v){
  const r = await apiPost({ action:'setEstado', planeta: pid, estado: v });
  if(!r || !r.ok){ showToast('⚠ No se pudo guardar el cambio (revisa tu conexión)', 'err'); return false; }
  return true;
}
async function saveResponse(pid, entry){
  const d = entry.detalle || [];
  const body = {
    action:'save', nombre: entry.nombre, grupo: entry.grupo, planeta: pid, puntaje: entry.puntaje,
    p1_pregunta: d[0] ? d[0].pregunta : '', p1_respuesta: d[0] ? d[0].respuesta : '', p1_correcta: d[0] ? d[0].correcta : '', p1_tiempo: d[0] ? d[0].tiempo : '',
    p2_pregunta: d[1] ? d[1].pregunta : '', p2_respuesta: d[1] ? d[1].respuesta : '', p2_correcta: d[1] ? d[1].correcta : '', p2_tiempo: d[1] ? d[1].tiempo : ''
  };
  const r = await apiPost(body);
  if(!r || !r.ok){
    if(r && r.error === 'ya_jugado'){ showToast('⚠ Ya habías jugado este planeta', 'err'); return false; }
    showToast('⚠ No se pudo guardar tu resultado, intenta de nuevo', 'err');
    return false;
  }
  showToast('✓ Resultado guardado', 'ok');
  return true;
}
async function fetchAllResponses(pid){
  const r = await apiGet({ action:'getResponses', planeta: pid });
  if(!Array.isArray(r)) return null;
  r.sort((a,b)=> b.puntaje - a.puntaje);
  return r;
}

/* ─────────── LANDING: elegir planeta ─────────── */
function renderLanding(){
  setAccent('#0BBBEF');
  app.innerHTML = `
    <div class="landing">
      <div class="eyebrow">Alianza Galáctica · EDX + EXO</div>
      <h1>Pasaporte Interplanetario</h1>
      <p class="sub">Toca el planeta en el que te encuentras ahora mismo</p>
      <div class="planet-grid">
        ${Object.entries(PLANETS).map(([id,p])=>`
          <div class="planet-card" data-p="${id}" style="--pc-accent:${p.accent}">
            <div class="pc-img" style="background-image:url('${p.img}')"></div>
            <div class="pc-body">
              <div class="pc-badge">${p.icon} PLANETA</div>
              <div class="pc-name">${p.name}</div>
              <div class="pc-tag">${p.tagline}</div>
            </div>
          </div>`).join('')}
      </div>
      <a class="gear-link" id="gearLink" href="javascript:void(0)">⚙ Organizador</a>
    </div>
  `;
  document.querySelectorAll('.planet-card').forEach(c=>{
    c.onclick = ()=>{ currentPlanet = c.dataset.p; setAccent(PLANETS[currentPlanet].accent); startPlanetFlow(); };
  });
  document.getElementById('gearLink').onclick = renderPin;
}

/* ─────────── FLUJO PARTICIPANTE ─────────── */
async function startPlanetFlow(){
  const estado = await getEstado(currentPlanet);
  const p = PLANETS[currentPlanet];
  if(estado === 'cerrado'){
    app.innerHTML = `
      <div class="card result-wrap">
        <div class="card-head"><div class="p-icon">🚫</div><h2>${p.name}</h2></div>
        <p class="result-msg">Este stand ya cerró su registro.<br>¡Gracias por participar en la misión!</p>
        <a class="back-link" id="backLink" href="javascript:void(0)">← Volver</a>
      </div>`;
    document.getElementById('backLink').onclick = renderLanding;
    return;
  }
  renderPlanetPin();
}

function renderPlanetPin(){
  const p = PLANETS[currentPlanet];
  app.innerHTML = `
    <div class="card">
      <div class="card-banner" style="background-image:url('${p.img}')"><span class="cb-badge">${p.icon} ${p.name}</span></div>
      <div class="card-head">
        <h2>${p.name}</h2>
        <p>Ingresa el PIN que te dio el facilitador de este planeta</p>
      </div>
      <div class="field"><input id="planetPinInput" type="password" inputmode="numeric" placeholder="••••" maxlength="6" style="text-align:center;font-family:var(--font-d);font-size:22px;letter-spacing:8px"></div>
      <button class="btn-main" id="planetPinBtn">Continuar</button>
      <div id="planetPinErr" style="color:#FF5C5C;font-size:12px;text-align:center;margin-top:10px;display:none">PIN incorrecto, pregúntale al facilitador</div>
      <a class="back-link" id="backLink" href="javascript:void(0)">← Elegir otro planeta</a>
    </div>
  `;
  document.getElementById('planetPinBtn').onclick = ()=>{
    const v = document.getElementById('planetPinInput').value;
    if(v === p.pin){ renderIdentity(); }
    else{ document.getElementById('planetPinErr').style.display = 'block'; }
  };
  document.getElementById('planetPinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('planetPinBtn').click(); });
  document.getElementById('backLink').onclick = renderLanding;
}

function renderIdentity(){
  const p = PLANETS[currentPlanet];
  app.innerHTML = `
    <div class="card">
      <div class="card-banner" style="background-image:url('${p.img}')"><span class="cb-badge">${p.icon} ${p.name}</span></div>
      <div class="card-head">
        <h2>${p.name}</h2>
        <p>${p.tagline}</p>
      </div>
      <div class="field">
        <label>Nombre completo</label>
        <input id="nameInput" type="text" placeholder="Escribe tu nombre">
      </div>
      <div class="field">
        <label>Tu grupo</label>
        <div class="grp-row" id="grpRow">${[1,2,3,4].map(n=>`<button class="grp-btn" data-g="${n}">${n}</button>`).join('')}</div>
      </div>
      <button class="btn-main" id="startBtn" disabled>Comenzar el reto</button>
      <a class="back-link" id="backLink" href="javascript:void(0)">← Elegir otro planeta</a>
    </div>
  `;
  let selGrp = null;
  document.querySelectorAll('.grp-btn').forEach(b=>{
    b.onclick = ()=>{ document.querySelectorAll('.grp-btn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selGrp=b.dataset.g; checkReady(); };
  });
  const nameInput = document.getElementById('nameInput');
  nameInput.addEventListener('input', checkReady);
  function checkReady(){ document.getElementById('startBtn').disabled = !(nameInput.value.trim().length>1 && selGrp); }
  document.getElementById('startBtn').onclick = async ()=>{
    const nombre = nameInput.value.trim();
    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;
    startBtn.textContent = 'Verificando…';
    const check = await apiGet({ action:'checkPlayed', planeta: currentPlanet, nombre: nombre });
    if(check && check.jugado){
      app.innerHTML = `
        <div class="card result-wrap">
          <div class="card-banner" style="background-image:url('${p.img}')"><span class="cb-badge">${p.icon} ${p.name}</span></div>
          <div class="card-head"><h2>${p.name}</h2></div>
          <p class="result-msg">${nombre} ya registró su resultado en este planeta.<br>Cada persona puede jugar cada planeta una sola vez.</p>
          <a class="back-link" id="backLink" href="javascript:void(0)">← Elegir otro planeta</a>
        </div>`;
      document.getElementById('backLink').onclick = renderLanding;
      return;
    }
    session = { nombre: nombre, grupo: selGrp, qIndex:0, puntaje:0, detalle:[] };
    renderQuestion();
  };
  document.getElementById('backLink').onclick = renderLanding;
}

          <svg width="56" height="56" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/>
            <circle id="ringProgress" cx="28" cy="28" r="24" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 28 28)" stroke-dasharray="${circumference}" stroke-dashoffset="0"/>
          </svg>
          <div class="ring-num" id="ringNum">${timeLeft}</div>
        </div>
        <div>
          <div class="q-progress">Pregunta ${session.qIndex+1} de ${p.questions.length}</div>
          <div class="q-text">${qData.q}</div>
        </div>
      </div>
      <div class="opts" id="optsWrap">
        ${qData.opts.map((o,i)=>`<button class="opt-btn" data-i="${i}"><span class="opt-letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}
      </div>
    </div>
  `;
  const ring = document.getElementById('ringNum');
  const ringProgress = document.getElementById('ringProgress');
  let answered = false;
  timerHandle = setInterval(()=>{
    timeLeft -= 1;
    ring.textContent = Math.max(timeLeft,0);
    ringProgress.setAttribute('stroke-dashoffset', circumference*(1 - Math.max(timeLeft,0)/QTIME));
    if(timeLeft <= 0){ clearInterval(timerHandle); if(!answered) resolveAnswer(null, 0); }
  }, 1000);
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = ()=>{ if(answered) return; answered = true; clearInterval(timerHandle); resolveAnswer(parseInt(btn.dataset.i), timeLeft); };
  });
  function resolveAnswer(chosenIndex, remaining){
    document.querySelectorAll('.opt-btn').forEach(b=>b.disabled = true);
    const correct = qData.correct;
    if(chosenIndex !== null){ document.querySelector(`.opt-btn[data-i="${chosenIndex}"]`).classList.add(chosenIndex===correct?'correct':'wrong'); }
    const isCorrect = chosenIndex === correct;
    const pts = isCorrect ? (100 + Math.round(50 * Math.max(remaining,0)/QTIME)) : 0;
    session.puntaje += pts;
    const tiempoTardado = QTIME - Math.max(remaining,0); // segundos que tardó en responder
    session.detalle.push({
      pregunta: qData.q,
      respuesta: chosenIndex !== null ? qData.opts[chosenIndex] : '(sin responder)',
      correcta: isCorrect ? 'Sí' : 'No',
      tiempo: tiempoTardado + 's',
      puntos: pts
    });
    setTimeout(()=>{
      if(session.qIndex < p.questions.length - 1){ session.qIndex += 1; renderQuestion(); }
      else{ finishSession(); }
    }, 1400);
  }
}

async function finishSession(){
  const p = PLANETS[currentPlanet];
  await saveResponse(currentPlanet, { nombre: session.nombre, grupo: session.grupo, puntaje: session.puntaje, ts: Date.now(), detalle: session.detalle });
  const max = p.questions.length * 150;
  let msg = "¡Buen trabajo, viajero!";
  if(session.puntaje >= max*0.8) msg = "¡Increíble! Dominas este planeta.";
  else if(session.puntaje < max*0.4) msg = "¡Sigue explorando el sistema EDX + EXO!";
  app.innerHTML = `
    <div class="card result-wrap">
      <div class="card-banner" style="background-image:url('${p.img}')"><span class="cb-badge">${p.icon} ${p.name}</span></div>
      <div class="card-head"><h2>${p.name}</h2></div>
      <div class="result-label">Tu puntaje</div>
      <div class="result-score">${session.puntaje}</div>
      <p class="result-msg">${msg}</p>
      <p class="result-msg" style="color:var(--ink3);font-size:12.5px">Asistencia registrada para ${session.nombre} · Grupo ${session.grupo}</p>
      <div style="margin-top:18px;font-size:13px;color:var(--ink3)">🚀 Continúa tu viaje al siguiente planeta</div>
      <a class="back-link" id="backLink" href="javascript:void(0)">← Ir a otro planeta</a>
    </div>
  `;
  document.getElementById('backLink').onclick = renderLanding;
}

/* ─────────── ORGANIZADOR ─────────── */
function renderPin(){
  setAccent('#0BBBEF');
  app.innerHTML = `
    <div class="pin-wrap">
      <div class="eyebrow">Acceso restringido</div>
      <div class="card" style="max-width:320px">
        <div class="card-head"><div class="p-icon">🔐</div><h2>Modo organizador</h2></div>
        <div class="field"><input id="pinInput" type="password" inputmode="numeric" placeholder="••••" maxlength="4" style="text-align:center;font-family:var(--font-d);font-size:22px;letter-spacing:8px"></div>
        <button class="btn-main" id="pinBtn">Entrar</button>
        <div id="pinErr" style="color:#FF5C5C;font-size:12px;text-align:center;margin-top:10px;display:none">PIN incorrecto</div>
        <a class="back-link" id="backLink" href="javascript:void(0)">← Volver</a>
      </div>
    </div>`;
  document.getElementById('pinBtn').onclick = ()=>{
    const v = document.getElementById('pinInput').value;
    if(v === HOST_PIN){ currentDashTab = 'automatica'; renderDashboard(); } else { document.getElementById('pinErr').style.display='block'; }
  };
  document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('pinBtn').click(); });
  document.getElementById('backLink').onclick = renderLanding;
}

let currentDashTab = 'automatica'; // 'automatica'|'datanova'|'humania'|'impactus'|'general'

async function renderDashboard(){
  const accentFor = currentDashTab==='general' ? '#FFD54A' : PLANETS[currentDashTab].accent;
  setAccent(accentFor);
  app.innerHTML = `
    <div class="host-wrap">
      <div class="eyebrow">Panel del organizador</div>
      <div class="tabs">
        ${Object.entries(PLANETS).map(([id,p])=>`<button class="tab ${id===currentDashTab?'active':''}" data-t="${id}" style="--tab-accent:${p.accent}">${p.icon} ${p.name.replace('Planeta ','')}</button>`).join('')}
        <button class="tab ${currentDashTab==='general'?'active':''}" data-t="general" style="--tab-accent:#FFD54A">🏆 General</button>
      </div>
      <div id="panelBody"><div style="text-align:center;padding:30px;color:var(--ink2)">Cargando…</div></div>
      <a class="back-link" id="backLink" href="javascript:void(0)">← Salir del panel</a>
    </div>
  `;
  document.querySelectorAll('.tab').forEach(t=>{ t.onclick = ()=>{ currentDashTab = t.dataset.t; renderDashboard(); }; });
  document.getElementById('backLink').onclick = renderLanding;
  if(currentDashTab === 'general') await renderGeneralPanel();
  else await renderPlanetPanel(currentDashTab);
}

async function renderPlanetPanel(pid){
  const p = PLANETS[pid];
  const estado = await getEstado(pid);
  const data = await fetchAllResponses(pid);

  if(data === null){
    document.getElementById('panelBody').innerHTML = `
      <div class="host-top"><div class="host-title">${p.icon} ${p.name}</div></div>
      <div class="status-pill" style="margin-bottom:14px">🔑 PIN de entrada: <b style="letter-spacing:2px;margin-left:4px">${p.pin}</b></div>
      <div class="empty-lb">
        ⚠ No se pudo conectar con la Hoja de Google en este momento.<br><br>
        Revisa tu conexión e intenta 'Actualizar'. Si sigue fallando, verifica que el Apps Script siga implementado con acceso "Cualquier usuario".
      </div>
      <div class="actions-row" style="margin-top:14px"><button class="btn-ghost2" id="retryBtn">↻ Reintentar</button></div>
    `;
    document.getElementById('retryBtn').onclick = ()=>renderPlanetPanel(pid);
    return;
  }

  const total = data.length;
  const avg = total ? Math.round(data.reduce((s,d)=>s+(d.puntaje||0),0)/total) : 0;
  const rows = data.map((d,i)=>`<tr><td>${i+1}</td><td>${d.nombre||'—'}</td><td>${d.grupo||'—'}</td><td><b>${d.puntaje}</b> pts</td></tr>`).join('');
  document.getElementById('panelBody').innerHTML = `
    <div class="host-top">
      <div class="host-title">${p.icon} ${p.name}</div>
      <span class="status-pill ${estado==='cerrado'?'closed':''}"><span class="status-dot"></span>${estado==='cerrado'?'Cerrado':'Abierto'}</span>
    </div>
    <div class="status-pill" style="margin-bottom:14px">🔑 PIN de entrada: <b style="letter-spacing:2px;margin-left:4px">${p.pin}</b></div>
    <div class="host-stats">
      <div class="stat-chip"><b>${total}</b><span>Participantes</span></div>
      <div class="stat-chip"><b>${avg}</b><span>Promedio</span></div>
      <div class="stat-chip"><b>${total?data[0].puntaje:0}</b><span>Máximo</span></div>
    </div>
    <div class="actions-row">
      ${estado==='cerrado' ? `<button class="btn-open" id="toggleBtn">Reabrir formulario</button>` : `<button class="btn-danger" id="toggleBtn">Cerrar formulario</button>`}
      <button class="btn-ghost2" id="refreshBtn">↻ Actualizar</button>
    </div>
    ${total ? `<table class="lb"><thead><tr><th>#</th><th>Nombre</th><th>Grupo</th><th>Puntaje</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty-lb">Aún no hay respuestas registradas para este planeta.</div>`}
  `;
  document.getElementById('toggleBtn').onclick = async ()=>{
    const ok = await setEstado(pid, estado==='cerrado'?'abierto':'cerrado');
    if(ok) showToast(estado==='cerrado' ? '✓ Formulario reabierto' : '✓ Formulario cerrado', 'ok');
    renderPlanetPanel(pid);
  };
  document.getElementById('refreshBtn').onclick = ()=>{ showToast('↻ Actualizando…'); renderPlanetPanel(pid); };
}

async function renderGeneralPanel(){
  const allData = {};
  for(const pid of Object.keys(PLANETS)){ allData[pid] = await fetchAllResponses(pid); }

  const failed = Object.values(allData).some(v => v === null);
  if(failed){
    document.getElementById('panelBody').innerHTML = `
      <div class="host-top"><div class="host-title">🏆 Resultados generales (4 planetas)</div></div>
      <div class="empty-lb">
        ⚠ No se pudo conectar con la Hoja de Google en este momento.<br><br>
        Revisa tu conexión a internet e intenta 'Actualizar' de nuevo. Si el problema sigue, verifica que el Apps Script siga implementado y con acceso "Cualquier usuario".
      </div>
    `;
    return;
  }

  // Agregar por nombre normalizado (trim + minúsculas)
  const combined = {}; // key -> {nombre, grupo, total, porPlaneta:{}}
  for(const pid of Object.keys(PLANETS)){
    for(const entry of allData[pid]){
      const key = (entry.nombre||'').trim().toLowerCase();
      if(!key) continue;
      if(!combined[key]) combined[key] = { nombre: entry.nombre, grupo: entry.grupo, total: 0, porPlaneta: {} };
      combined[key].total += (entry.puntaje||0);
      combined[key].porPlaneta[pid] = (combined[key].porPlaneta[pid]||0) + entry.puntaje;
    }
  }
  const ranking = Object.values(combined).sort((a,b)=>b.total-a.total);
  const top3 = ranking.slice(0,3);
  const medals = ['🥇','🥈','🥉'];

  const rows = ranking.map((d,i)=>`
    <tr><td>${i+1}</td><td>${d.nombre}</td><td>${d.grupo||'—'}</td><td><b>${d.total}</b> pts</td></tr>
  `).join('');

  document.getElementById('panelBody').innerHTML = `
    <div class="host-top"><div class="host-title">🏆 Resultados generales (4 planetas)</div></div>
    <div class="host-stats">
      <div class="stat-chip"><b>${ranking.length}</b><span>Viajeros totales</span></div>
      <div class="stat-chip"><b>${ranking.length?Math.round(ranking.reduce((s,d)=>s+d.total,0)/ranking.length):0}</b><span>Promedio general</span></div>
      <div class="stat-chip"><b>${ranking.length?ranking[0].total:0}</b><span>Puntaje más alto</span></div>
    </div>
    ${top3.length ? `
    <div class="podium">
      ${top3.map((d,i)=>`
        <div class="podium-slot">
          <div class="medal">${medals[i]}</div>
          <div class="pname">${d.nombre}</div>
          <div class="pscore">${d.total} pts</div>
        </div>`).join('')}
    </div>` : ''}
    <div class="actions-row"><button class="btn-ghost2" id="refreshGeneralBtn">↻ Actualizar</button></div>
    ${ranking.length ? `<table class="lb"><thead><tr><th>#</th><th>Nombre</th><th>Grupo</th><th>Puntaje total</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty-lb">Aún no hay respuestas registradas en ningún planeta.</div>`}
  `;
  document.getElementById('refreshGeneralBtn').onclick = ()=>{ showToast('↻ Actualizando…'); renderGeneralPanel(); };
}

/* ─────────── INICIO ─────────── */
renderLanding();
</script>
